[project]
name = "twinfinder"
version = "0.3.0"
description = "Find duplicate photos and videos by content (exact and similar) and clean them up safely"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=10"]
fast = ["blake3>=0.4"]
trash = ["send2trash>=1.8"]
all = ["Pillow>=10", "blake3>=0.4", "send2trash>=1.8"]
dev = ["pytest>=8", "Pillow>=10", "send2trash>=1.8"]

[project.scripts]
twinfinder = "twinfinder.cli:main"

[project.gui-scripts]
twinfinder-gui = "twinfinder.gui:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["twinfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
